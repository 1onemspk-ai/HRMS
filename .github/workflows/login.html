<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1ONEMS HRMS Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
    .login-box h2 { margin-bottom: 20px; color: #333; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #ff6a00; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #e55e00; }
    #error { color: red; margin-top: 10px; font-size: 14px; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJZ0r9qZvfMWY33GyMvCgYaCxmrA7c",
      authDomain: "onems---hrms.firebaseapp.com",
      projectId: "onems---hrms",
      storageBucket: "onems---hrms.firebasestorage.app",
      messagingSenderId: "129741940588",
      appId: "1:129741940588:web:fe8fa119a21699366b3549",
      measurementId: "G-QKRZX3ZZNJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('error');
      
      if(!email || !pass){
        errorBox.innerText = "Email aur Password likho!";
        return;
      }

      signInWithEmailAndPassword(auth, email, pass)
        .then(() => {
          window.location.href = "dashboard.html"; 
        })
        .catch((error) => {
          errorBox.innerText = error.message;
        });
    }
  </script>
</head>
<body>
  <div class="login-box">
    <h2>1ONEMS - HRMS Login</h2>
    <input id="email" type="email" placeholder="Email - admin@1onems.com" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="error"></p>
  </div>
</body>
</html>
